# Keeps the Streamlit Community Cloud app awake. The app hibernates after ~12 h without a browser session, and a plain HTTP
# request does not count, so this opens the page in a real headless browser (and clicks "get this app back up" if it is asleep).
# Setup: repo Settings > Secrets and variables > Actions > Variables > New repository variable  APP_URL = https://<your-app>.streamlit.app
name: keep-streamlit-awake
on:
  schedule:
    - cron: "17 */6 * * *"     # every 6 hours (hibernation threshold is 12 h)
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && playwright install --with-deps chromium
      - name: Visit the app
        env: { APP_URL: "${{ vars.APP_URL }}" }
        run: |
          test -n "$APP_URL" || { echo "Set the APP_URL repository variable"; exit 1; }
          python - <<'PY'
          import os, sys
          from playwright.sync_api import sync_playwright
          url = os.environ["APP_URL"]
          with sync_playwright() as p:
              b = p.chromium.launch(); pg = b.new_page()
              pg.goto(url, wait_until="domcontentloaded", timeout=90000)
              pg.wait_for_timeout(5000)
              wake = pg.get_by_role("button", name="Yes, get this app back up!")
              if wake.count():
                  print("app was asleep; waking it"); wake.first.click(); pg.wait_for_timeout(60000)
              # the app is up when its title renders (inside the Streamlit iframe-free DOM)
              ok = pg.get_by_text("Do hurricane clauses create fiscal space?").first.is_visible(timeout=60000)
              print("app up:", ok); b.close(); sys.exit(0 if ok else 1)
          PY
