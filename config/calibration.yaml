# Calibration for the hurricane-clause Monte Carlo model.
# Units: damage D, debt b, primary deficit pd, GFN are in % of GDP expressed as plain numbers (10 = 10%).
#        Rates (r, g, theta*) and shares are decimals (0.03 = 3%). theta_b, theta_G are decimal rate per
#        percentage point of debt / GFN above threshold.
# Status: PLACEHOLDER_VERIFY = no source yet (reported at every run); SOURCED = number read from a source;
# CALIBRATED = our own calculation from sourced numbers (see `note`); ASSUMPTION = our modelling choice;
# VERIFIED = RESERVED: only a group member sets it, after opening the source. r_bar, r_safe and g_bar are NOMINAL.

parameters:
  lambda:
    value: 0.051
    source: "Mallucci (2020) IFDP 1291r1, Table 1 Panel B p.9; definition fn.14 p.8; hit list Table 7 p.27"
    status: SOURCED
    meaning: "annual probability of a major hurricane (Cat >= 3 hit on Grenada), baseline frequency = 2/39 since 1980"
    note: "OPEN: Mallucci counts Emily 2005, which was Cat 1 at Grenada per ReliefWeb/OCHA; HURDAT2 check pending (see docs/AI_LOG.md). Updated 1980-2024 value with Beryl would be 3/45 = 0.067 (JUDGMENT, not used). Sensitivity 0.10 (Guerson 2020, IMF WP/20/266 App.1 p.25) is a different definition and lives in scenario grenada_like_lambda_010."
  mu_D:
    value: 2.414
    source: "World Bank, Country Disaster Risk Profile: Grenada (2016), 1-page profile, hurricane panel (AAL 0.9% GDP; 250-yr PML 43.6% GDP; GDP US$912m); cap 200% from Asonuma et al. 2017 IMF WP/17/171 Sec. III.A, Box 2 pp.25-26 (Ivan 2004 ~200% GDP)"
    status: CALIBRATED
    meaning: "log of the median damage given a hit: median damage = exp(mu_D) = 11.18% of GDP (D = exp(mu_D + sigma_D z))"
    note: "CALIBRATED: Lognormal fit solving lambda*E[min(D,200)] = 0.9 (AAL, % GDP) and lambda*P(D>43.6) = 1/250 (250-yr PML, % GDP) at lambda = 0.051; reproduced by docs/fit.py. Models building losses only, so it understates total damage. lambda, mu_D and sigma_D describe the same set of events and must move together. Median 11.18% of GDP -> mu_D = ln(11.18) = 2.414."
  sigma_D:
    value: 0.96
    source: "World Bank, Country Disaster Risk Profile: Grenada (2016), 1-page profile, hurricane panel (AAL 0.9% GDP; 250-yr PML 43.6% GDP; GDP US$912m); cap 200% from Asonuma et al. 2017 IMF WP/17/171 Sec. III.A, Box 2 pp.25-26 (Ivan 2004 ~200% GDP)"
    status: CALIBRATED
    meaning: "standard deviation of log damage (lognormal sigma)"
    note: "CALIBRATED: same fit as mu_D (sigma = 0.9615, entered as 0.96)."
  D_max:
    value: 200
    source: ""
    status: PLACEHOLDER_VERIFY
    meaning: "cap on damage, % of GDP"
    note: "Used as the cap in the mu_D / sigma_D fit (docs/fit.py); Ivan 2004 ~ 200% GDP (Asonuma et al. 2017 Sec. III.A). Changing it invalidates the fit."
  D_trig:
    value: 5
    source: ""
    status: PLACEHOLDER_VERIFY
    meaning: "clause trigger threshold, % of GDP damage (proxy for a parametric trigger)"
  g_bar:
    value: 0.048
    source: "IMF Country Report 26/9 (Grenada 2025 Art. IV), Table 1 p.26, 2029-30 (nominal 4.8%; real 2.7%)"
    status: SOURCED
    meaning: "trend NOMINAL GDP growth (same basis as r_bar and r_safe)"
    note: "Nominal-nominal basis chosen so that (1+r)/(1+g) is consistent; the real pair would be r_bar real / g 2.7%."
  phi:
    value: 0.15
    source: ""
    status: PLACEHOLDER_VERIFY
    meaning: "output loss per unit of damage: growth falls by phi*D/100 in the hit year"
  psi:
    value: 0.5
    source: ""
    status: PLACEHOLDER_VERIFY
    meaning: "share of lost output recovered the following year through rebuilding"
  kappa:
    value: 0.42
    source: "IMF Country Report 25/39 (Grenada 2024 Art. IV): p.9 table, para 17 pp.12-13 (reconstruction capex 10.2% GDP, 2024-26); para 8 p.7 (Beryl damage 16.5% GDP; CCRIF payout US$44m = 3.2% GDP)"
    status: CALIBRATED
    meaning: "share of damage financed by the budget, net of insurance (the model has no separate insurance channel)"
    note: "CALIBRATED: (10.2 - 3.2) / 16.5 = 0.42. Gross share without netting CCRIF = 10.2 / 16.5 = 0.62 (sensitivity scenario grenada_like_kappa_062). Realised spending is running below the 10.2% plan (CR 26/9 Box 1 p.7)."
  R:
    value: 3
    source: "IMF Country Report 25/39 (2024-26 reconstruction window); IMF CR 26/9 Box 1 p.7 (about 4.5% GDP spent by Jul 2025, about 6% by end-2025, continuing into 2026)"
    status: CALIBRATED
    meaning: "years over which reconstruction spending is spread"
    note: "CALIBRATED: the 2024-26 window = 3 years."
  r_bar:
    value: 0.024
    source: "IMF Country Report 25/39 (Grenada 2024 Art. IV), DSA para 5 p.4 (effective interest rate on central government debt, 2023)"
    status: SOURCED
    meaning: "effective interest rate, NOMINAL, Version 1 (exogenous, constant); same basis as g_bar"
    note: "Grenada's debt is mostly concessional (multilaterals hold 66.8% of external central-government debt), so r < g here. The 2024 weighted average of 8.0% (Debt Report 2024 p.14) is distorted by one-off payments and not used. scenario high_debt overrides this."
  r_safe:
    value: 0.024
    source: "set equal to r_bar (see note)"
    status: CALIBRATED
    meaning: "safe rate, NOMINAL, Version 2 (the risk premium is added on top of it); same basis as g_bar"
    note: "CALIBRATED: Version 2 computes r_eff = (1-1/M) r_eff_prev + (r_safe + x_t)/M, so r_safe is set equal to r_bar in every scenario, making Version 2 equal Version 1 when the premium x_t = 0."
  M:
    value: 10.6
    source: "Grenada Ministry of Finance, Debt Report 2024, Table 7 p.14 (average time to maturity 10.6 years in 2024; 10.4 in 2023; also IMF CR 25/39 DSA para 5 p.4)"
    status: SOURCED
    meaning: "average time to maturity in years (1/M of each stock matures per year; also the Version 2 rate-smoothing speed)"
  s:
    # Generic default used by tests/app. Experiments use the named designs in config/designs.yaml instead.
    value: 0.60
    source: ""
    status: PLACEHOLDER_VERIFY
    meaning: "initial share of debt covered by the clause"
  K:
    value: 2
    source: ""
    status: PLACEHOLDER_VERIFY
    meaning: "deferral length in years"
  theta_b:
    value: 0.0005
    source: ""
    status: PLACEHOLDER_VERIFY
    meaning: "risk premium per pp of debt/GDP above b_bar (Version 2 only)"
  theta_G:
    value: 0.002
    source: ""
    status: PLACEHOLDER_VERIFY
    meaning: "risk premium per pp of GFN/GDP above GFN_bar (Version 2 only)"
  b_bar:
    value: 60
    source: ""
    status: PLACEHOLDER_VERIFY
    meaning: "debt/GDP threshold above which the premium rises (Version 2 only)"
  GFN_bar:
    value: 15
    source: ""
    status: PLACEHOLDER_VERIFY
    meaning: "GFN/GDP threshold above which the premium rises (Version 2 only)"
  repay_rule:
    value: "equal_instalments"
    source: "Asonuma et al. 2017 IMF WP/17/171 App. II p.51; Ho & Fontana (2021) EMRJ 11 p.8 (equal semi-annual instalments over the remaining term)"
    status: SOURCED
    meaning: "how the deferred principal is repaid: equal_instalments (equal amounts over defer_repay_years, fully cleared) or declining_balance (1/m of the remaining balance each year, never fully cleared)"
    note: "OPEN conflict (register Task 5): IMF CR 25/39 and CR 26/9 Box 1 fn.1 p.7 say deferred amounts are added to the lump-sum principal due at maturity in 2030. Check the bond terms or the MoF notice. declining_balance is kept as a sensitivity."
  defer_repay_years:
    value: 8
    source: ""
    status: PLACEHOLDER_VERIFY
    meaning: "ECONOMIC DESIGN PARAMETER: years over which deferred principal (defbal) is repaid after a deferral. = M gives post-window GFN of B equal to A (no hump); shorter than M creates a repayment hump. Set from the actual clause terms (remaining life of the instrument)."
  GFN_margin:
    value: 5
    source: ""
    status: ASSUMPTION
    meaning: "hurricane-attributable liquidity crisis: GFN exceeds the no-hurricane (lambda=0) baseline path by more than this many pp of GDP"
    note: "ASSUMPTION: our own modelling choice, not a sourced number."
  max_triggers:
    value: 3
    source: "Asonuma et al. 2017 IMF WP/17/171 App. II p.51; Ho & Fontana (2021) EMRJ 11 p.8"
    status: SOURCED
    meaning: "lifetime cap on the number of clause activations per path (every qualifying hit while the clause is still available uses one trigger)"
  use_trigger_cap:
    value: 1
    source: "Asonuma et al. 2017 IMF WP/17/171 App. II p.51; Ho & Fontana (2021) EMRJ 11 p.8"
    status: SOURCED
    meaning: "1 = the lifetime trigger cap is on (default), 0 = unlimited triggers (the ICMA model clause has no cap: Ho & Fontana p.9)"
  deferral_spread:
    value: 0.0025
    source: "proxy for delay-risk pricing, cf. Mallucci 2022"
    status: ASSUMPTION
    meaning: "constant spread (decimal, 0.0025 = 25 bps) added to the covered debt's interest rate in Regimes B/C only (robustness switch)"
    note: "ASSUMPTION: our own modelling choice (25 bp), not a sourced number."
  deferral_premium_on:
    value: 0
    source: "proxy for delay-risk pricing, cf. Mallucci 2022"
    status: PLACEHOLDER_VERIFY
    meaning: "1 = apply deferral_spread to the covered stock in B/C; 0 = off (default)"
  no_surplus_rule:
    # Added after review of negative debt in Regime C (DECISIONS #31). Effect on C was immaterial, so default OFF.
    value: 0
    source: ""
    status: PLACEHOLDER_VERIFY
    meaning: "1 = once total debt falls below zero, the primary balance is floored at 0 for the rest of the path (no more surpluses to retire debt that no longer exists); reconstruction deficits still apply. 0 = off"
  x_max:
    # Added by the model builder (not in the original spec): without a cap the linear premium makes
    # debt explode numerically (r-g grows with b). Documented in docs/DECISIONS.md.
    value: 0.10
    source: ""
    status: PLACEHOLDER_VERIFY
    meaning: "cap on the risk premium x_t (decimal, 0.10 = 10pp); numerical/economic backstop, Version 2 only"
  GFN_crit:
    value: 15
    source: ""
    status: ASSUMPTION
    meaning: "liquidity-crisis threshold, GFN as % of GDP"
    note: "ASSUMPTION: our own modelling choice, not a sourced number."
  rho:
    value: 0.0
    source: ""
    status: PLACEHOLDER_VERIFY
    meaning: "fiscal reaction of primary deficit to debt above target (off by default)"
  b_star:
    value: 60
    source: ""
    status: PLACEHOLDER_VERIFY
    meaning: "debt target used by the fiscal reaction rule"

# Simulation settings (not economic calibration)
simulation:
  T: 30
  N: 10000
  seed: 42
